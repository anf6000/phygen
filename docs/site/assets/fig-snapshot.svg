<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-label="How a child package is published as an immutable snapshot and then captured">
  <style>
    text { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; fill: #000; }
    .n   { fill: #fff; stroke: #000; stroke-width: 1; }
    .n.q { fill: #f2f2f2; }
    .n.a { stroke: #0000ff; stroke-width: 2; }
    .nt  { font-size: 12px; font-weight: 700; }
    .ns  { font-size: 10px; fill: #767676; }
    .th  { font-size: 15px; font-weight: 700; }
    .sd  { font-size: 11px; fill: #767676; }
    .w   { fill: none; stroke: #000; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .w.a { stroke: #0000ff; }
    .lbl { font-size: 10.5px; fill: #767676; }
    .tag { font-size: 10.5px; fill: #0000ff; }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#000"/></marker>
    <marker id="aha" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#0000ff"/></marker>
  </defs>

  <text class="th" x="30" y="40">Publish and capture</text>
  <text class="sd" x="30" y="58">a child package becomes one immutable snapshot, and the frame is rendered from that snapshot</text>

  <rect class="n" x="20" y="80" width="180" height="80"/>
  <text class="nt" x="32" y="106">the workspace</text>
  <text class="ns" x="32" y="124">the accepted child</text>
  <text class="ns" x="32" y="138">(a copy of the parent,</text>
  <text class="ns" x="32" y="152">edited by one session)</text>

  <rect class="n" x="250" y="80" width="220" height="80"/>
  <text class="nt" x="262" y="106">hash and pending copy</text>
  <text class="ns" x="262" y="124">hash package-relative paths;</text>
  <text class="ns" x="262" y="138">copy into .pending-&lt;unique&gt;</text>
  <text class="ns" x="262" y="152">recompute and check the hash</text>

  <rect class="n" x="520" y="80" width="200" height="80"/>
  <text class="nt" x="532" y="106">the snapshot marker</text>
  <text class="ns" x="532" y="124">snapshot.json is written</text>
  <text class="ns" x="532" y="138">exclusively (create-new),</text>
  <text class="ns" x="532" y="152">never overwritten</text>

  <rect class="n a" x="770" y="80" width="220" height="80"/>
  <text class="nt" x="782" y="106">rename into place</text>
  <text class="ns" x="782" y="124">snapshots/&lt;artworkId&gt;/&lt;hash&gt;</text>
  <text class="ns" x="782" y="138">a rename is atomic. A race is</text>
  <text class="ns" x="782" y="152">re-verified; the loser is removed</text>

  <rect class="n q" x="770" y="250" width="220" height="80"/>
  <text class="nt" x="782" y="276">the snapshot directory</text>
  <text class="ns" x="782" y="294">files/ + snapshot.json</text>
  <text class="ns" x="782" y="308">immutable once published</text>

  <rect class="n" x="470" y="250" width="250" height="80"/>
  <text class="nt" x="482" y="276">verifySnapshot</text>
  <text class="ns" x="482" y="294">re-hash every listed file, compare</text>
  <text class="ns" x="482" y="308">per-file sha256 and the aggregate</text>
  <text class="ns" x="482" y="322">contentsHash with the marker and name</text>

  <rect class="n" x="130" y="250" width="280" height="80"/>
  <text class="nt" x="142" y="276">capture renders from the snapshot</text>
  <text class="ns" x="142" y="294">the sandboxed page is given the published</text>
  <text class="ns" x="142" y="308">files, step 2500, seed 1337, dpr 1</text>

  <line class="w" x1="200" y1="120" x2="250" y2="120" marker-end="url(#ah)"/>
  <line class="w" x1="470" y1="120" x2="520" y2="120" marker-end="url(#ah)"/>
  <line class="w" x1="720" y1="120" x2="770" y2="120" marker-end="url(#ah)"/>
  <line class="w a" x1="880" y1="160" x2="880" y2="250" marker-end="url(#aha)"/>
  <line class="w" x1="720" y1="290" x2="770" y2="290" marker-end="url(#ah)"/>
  <text class="lbl" x="724" y="284">verify</text>
  <polyline class="w" points="880,330 880,400 270,400 270,330" marker-end="url(#ah)"/>
  <text class="lbl" x="300" y="396">the published copy is the only input</text>

  <text class="lbl" x="30" y="440">A published snapshot never changes. The version record, the directory name, and the marker all agree on the same content hash.</text>
</svg>
