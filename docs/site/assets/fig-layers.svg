<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" role="img" aria-label="The four layers of phygen and the storage they share">
  <style>
    text { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; fill: #000; }
    .n   { fill: #fff; stroke: #000; stroke-width: 1; }
    .n.q { fill: #f2f2f2; }
    .nt  { font-size: 13px; font-weight: 700; }
    .ns  { font-size: 10.5px; fill: #767676; }
    .port{ fill: #000; }
    .w   { fill: none; stroke: #000; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .w.a { stroke: #0000ff; }
    .lbl { font-size: 10.5px; fill: #767676; }
    .tag { font-size: 10.5px; fill: #0000ff; }
    .cap { font-size: 11px; fill: #767676; }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#000"/></marker>
    <marker id="aha" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#0000ff"/></marker>
  </defs>

  <!-- nodes -->
  <rect class="n" x="30" y="60" width="210" height="78"/>
  <text class="nt" x="42" y="86">runtime/</text>
  <text class="ns" x="42" y="104">the artwork contract:</text>
  <text class="ns" x="42" y="118">adapter, schema, manifest,</text>
  <text class="ns" x="42" y="132">strict config loader</text>

  <rect class="n q" x="30" y="208" width="210" height="78"/>
  <text class="nt" x="42" y="234">threejs/</text>
  <text class="ns" x="42" y="252">one artwork package:</text>
  <text class="ns" x="42" y="266">physarum simulation,</text>
  <text class="ns" x="42" y="280">renderer, adapter</text>

  <rect class="n" x="360" y="120" width="250" height="108"/>
  <text class="nt" x="372" y="146">server/</text>
  <text class="ns" x="372" y="164">the controller: run loop,</text>
  <text class="ns" x="372" y="178">provider sessions, capture,</text>
  <text class="ns" x="372" y="192">budget, storage, API, and</text>
  <text class="ns" x="372" y="206">the separate artwork origin</text>

  <rect class="n" x="720" y="120" width="220" height="108"/>
  <text class="nt" x="732" y="146">web/</text>
  <text class="ns" x="732" y="164">the interface: the chain</text>
  <text class="ns" x="732" y="178">of cards, the agent shell,</text>
  <text class="ns" x="732" y="192">the live view. React and</text>
  <text class="ns" x="732" y="206">TypeScript</text>

  <rect class="n" x="360" y="330" width="250" height="78"/>
  <text class="nt" x="372" y="356">records and files</text>
  <text class="ns" x="372" y="374">data-evolve/ (SQLite, frames,</text>
  <text class="ns" x="372" y="388">workspaces) · snapshots/</text>
  <text class="ns" x="372" y="402">(immutable packages)</text>

  <rect class="n q" x="30" y="330" width="210" height="78"/>
  <text class="nt" x="42" y="356">artwork origin :8788</text>
  <text class="ns" x="42" y="374">the sandboxed page that</text>
  <text class="ns" x="42" y="388">plays a version; no API,</text>
  <text class="ns" x="42" y="402">no credentials</text>

  <!-- wires -->
  <polyline class="w" points="240,99 278,99 278,148 360,148" marker-end="url(#ah)"/>
  <polyline class="w" points="240,266 334,266 334,200 360,200" marker-end="url(#ah)"/>
  <line class="w a" x1="610" y1="174" x2="720" y2="174" marker-end="url(#aha)"/>
  <polyline class="w" points="720,214 660,214 660,206 610,206" marker-end="url(#ah)"/>
  <line class="w" x1="485" y1="228" x2="485" y2="330" marker-end="url(#ah)"/>
  <polyline class="w" points="135,330 135,300 135,286" marker-end="url(#ah)"/>
  <polyline class="w a" points="360,168 306,168 306,224 240,224" marker-end="url(#aha)"/>

  <!-- ports -->
  <rect class="port" x="236" y="95" width="8" height="8"/>
  <rect class="port" x="236" y="243" width="8" height="8"/>
  <rect class="port" x="356" y="146" width="8" height="8"/>
  <rect class="port" x="356" y="192" width="8" height="8"/>
  <rect class="port" x="606" y="170" width="8" height="8"/>
  <rect class="port" x="606" y="202" width="8" height="8"/>
  <rect class="port" x="481" y="224" width="8" height="8"/>
  <rect class="port" x="131" y="282" width="8" height="8"/>
  <rect class="port" x="356" y="164" width="8" height="8"/>

  <!-- wire labels -->
  <text class="lbl" x="246" y="92">adapter</text>
  <text class="lbl" x="246" y="240">implements</text>
  <text class="tag" x="628" y="167">HTTP API + SSE</text>
  <text class="lbl" x="628" y="230">commands</text>
  <text class="lbl" x="492" y="286">reads and writes</text>
  <text class="lbl" x="140" y="316">serves the snapshot</text>
  <text class="tag" x="300" y="285">capture: renders a child</text>
</svg>
